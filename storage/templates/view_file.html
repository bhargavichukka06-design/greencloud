
<!DOCTYPE html>
<html>
<head>
    <title>{{ file_name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 18px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .download-btn:hover {
            background: #1b5e20;
        }

        .content {
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>{{ file_name }}</h2>

    <a href="{{ original_file_url }}" download class="download-btn">
        Download Original File
    </a>

    <div class="content">
        {{ content|safe }}
    </div>

</div>

</body>
</html>

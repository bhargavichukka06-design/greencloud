<!DOCTYPE html>
<html>
<head>
    <title>{{ file_name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .content {
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>{{ file_name }}</h2>

    <div class="content">
        {{ content|safe }}
    </div>

</div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenCloud - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dff5e1, #ffffff);
            padding: 20px;
        }

        .register-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #198754;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .message {
            background: #e8f7ee;
            color: #198754;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #198754;
            box-shadow: 0 0 5px rgba(25, 135, 84, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #146c43;
            transform: translateY(-1px);
        }

        .login-link {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }

        .login-link a {
            color: #198754;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .footer-text {
            margin-top: 22px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">🌱 GreenCloud</div>

        <p class="subtitle">
            A Carbon-Aware Personal Storage System
        </p>

        <h2>Create Account</h2>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login/">Login here</a>
        </div>

        <div class="footer-text">
            🌍 Store smarter. Save storage. Reduce carbon impact.
        </div>

    </div>

</body>
</html>

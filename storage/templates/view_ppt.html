<!DOCTYPE html>
<html>
<head>
    <title>{{ file_name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .slide {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .slide h3 {
            color: #198754;
        }

        .slide p {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>{{ file_name }}</h2>

    {% for slide in slides %}

        <div class="slide">

            <h3>Slide {{ forloop.counter }}</h3>

            {% for text in slide %}
                <p>{{ text }}</p>
            {% empty %}
                <p>This slide contains no text.</p>
            {% endfor %}

        </div>

    {% endfor %}

</div>

</body>
</html>
